# TypeWords 静态站点 nginx 配置（复制为 /etc/nginx/conf.d/default.conf）

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 词库 JSON 体积较大，开启压缩。
    # 注意：nginx 1.21+ 的 mime.types 把 .js/.mjs 映射为 text/javascript，
    # 只写 application/javascript 会导致 JS 不被压缩，这里两个都列上。
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/xml text/javascript
                    application/javascript application/json application/xml
                    application/rss+xml image/svg+xml;

    # 音频（/sound、文章跟读）依赖 Range 请求拖动进度。
    # nginx 静态文件默认已发送 Accept-Ranges，无需手动 add_header（会重复）。

    # ---- 带内容哈希的构建产物：可长期强缓存 ----------------------------- #
    # 只用 add_header 设置 Cache-Control，不叠加 expires，
    # 否则响应里会出现两个 Cache-Control 头。
    location ^~ /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files  $uri =404;
    }

    # ---- @nuxt/image 优化产物 ------------------------------------------- #
    # 静态构建下只有被预渲染的页面会生成 /_ipx/ 文件；纯客户端渲染的页面
    # （words / articles / setting）引用的图片不会生成，这里回退到原图避免裂图。
    # /_ipx/w_100&f_webp/imgs/a.png  ->  回退 /imgs/a.png
    location ~ ^/_ipx/[^/]+/(?<ipx_path>.+)$ {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files  $uri /$ipx_path =404;
    }

    # ---- 词库 / 音频 / 图片 / 第三方库 ---------------------------------- #
    location ~ ^/(dicts|sound|libs|imgs|list)/ {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files  $uri =404;
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files  $uri =404;
    }

    # ---- 页面 ----------------------------------------------------------- #
    # HTML 不缓存，保证换镜像后浏览器立刻拿到新版本。
    # 200.html 是 nuxt generate 产出的 SPA 兜底页：未被预渲染的动态路由
    # （/book/:id、/practice-words/:id 等）直接刷新时靠它交给前端路由接管。
    location / {
        add_header Cache-Control "no-cache" always;
        try_files  $uri $uri.html $uri/index.html /200.html /index.html;
    }
}
