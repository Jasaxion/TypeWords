# TypeWords —— NAS / 自建服务器部署
#
# 快速开始：
#   cp docker/env.example .env      # 按需修改站点地址、端口
#   mkdir -p data                   # 数据目录，必须先建（见下）
#   docker compose up -d --build    # 构建并启动（端口 3000）
#
# 常用命令：
#   docker compose logs -f          # 看日志
#   docker compose up -d --build    # 更新代码后重新构建
#   docker compose down             # 停止并移除容器（data 目录保留）
#
# 数据存放：默认 SSR 模式，数据写在项目下的 ./data 目录里
# （容器内 /app/localdata）。清浏览器缓存、换浏览器、换设备都能恢复。
# 备份就是 cp -r data 备份目录，或直接用页面「设置 → 导出」下载 zip。
#
# 注意 ./data 的属主：bind mount 不会像命名卷那样自动 chown，
# 宿主机目录属主必须能被容器内的 PUID/PGID 写入，否则数据写不进去。

name: typewords

services:
  # ------------------------------------------------------------------------ #
  # SSR（默认）：数据持久化到服务器磁盘
  # ------------------------------------------------------------------------ #
  typewords:
    build:
      context: .
      target: ssr
      args:
        # 站点对外地址，用于生成 canonical / og:url 等绝对链接
        ORIGIN: ${ORIGIN:-http://localhost:3000}
        # 部署在子路径时填写，例如 /typewords/ ；根路径保持 /
        NUXT_APP_BASE_URL: ${NUXT_APP_BASE_URL:-/}
        API_BASE: ${API_BASE:-http://localhost/}
        VITE_PASSWORD_RSA_PUBLIC_KEY: ${VITE_PASSWORD_RSA_PUBLIC_KEY:-}
        # 构建阶段 Node 堆上限（MB）。NAS 内存小可以调低，但过低会 OOM。
        NODE_MAX_OLD_SPACE: ${NODE_MAX_OLD_SPACE:-4096}
    image: typewords:ssr
    container_name: typewords
    restart: unless-stopped
    # 以宿主机上 data 目录属主的身份运行，否则挂进来的目录写不进去。
    # 用 `id -u`/`id -g` 查看自己的 uid/gid，填到 .env 的 PUID/PGID。
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      # SSR 下 runtimeConfig 可在运行时覆盖，改这里重启即可，无需重新构建
      NUXT_PUBLIC_ORIGIN: ${ORIGIN:-http://localhost:3000}
      # 数据目录，与下面的挂载点保持一致
      STORAGE_PATH: /app/localdata
      # 外部词典目录，与下面的挂载点保持一致（见 scripts/fetch-dicts.py）
      DICTS_PATH: /app/dicts
      # 切勿设置 HOST：nitro 会把它当作监听地址，容器内会启动失败
      PORT: "3000"
    volumes:
      # 数据直接落在项目下的 ./data，备份/查看/迁移都是普通文件操作。
      # 启动前务必先手动建好这个目录（mkdir -p data）：目录不存在时
      # Docker 会用 root 建出来，容器内非 root 用户将无法写入。
      - ${DATA_DIR:-./data}:/app/localdata
      # 官方词典数据（约 430MB，不进 git 也不进镜像）。
      # 用 scripts/fetch-dicts.py 下载到这里，只读挂载即可。
      # 目录不存在或为空时自动回落到镜像内置的词典，不影响启动。
      - ${DICTS_DIR:-./dicts}:/app/dicts:ro
    ports:
      - "${TYPEWORDS_PORT:-3000}:3000"

  # ------------------------------------------------------------------------ #
  # 静态（可选）：镜像最小，但没有服务端，数据只存在浏览器里，清缓存即丢失。
  #   docker compose --profile static up -d --build typewords-static
  # ------------------------------------------------------------------------ #
  typewords-static:
    profiles: ["static"]
    build:
      context: .
      target: static
      args:
        ORIGIN: ${ORIGIN:-http://localhost:8080}
        NUXT_APP_BASE_URL: ${NUXT_APP_BASE_URL:-/}
        API_BASE: ${API_BASE:-http://localhost/}
        VITE_PASSWORD_RSA_PUBLIC_KEY: ${VITE_PASSWORD_RSA_PUBLIC_KEY:-}
        NODE_MAX_OLD_SPACE: ${NODE_MAX_OLD_SPACE:-4096}
    image: typewords:static
    container_name: typewords-static
    restart: unless-stopped
    ports:
      - "${TYPEWORDS_STATIC_PORT:-8080}:80"
